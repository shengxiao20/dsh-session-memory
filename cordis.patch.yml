# DSH persistence is authoritative. The plugin reads it through the public
# sessionPersistence service and maintains only its own source-turn index.
- insert:
    - id: dsh-session-memory
      name: '@shengxiao04/dsh-session-memory'
      config:
        jev:
          enabled: false
          model: nimble
          baseURL: 'http://127.0.0.1:11434'
          manageOllama: false
        obsidian:
          enabled: false
